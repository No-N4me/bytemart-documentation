site_name: Bytemart Documentation
site_url: https://docs.bytemart.net
theme:
  name: material
  custom_dir: overrides             # Local template overrides (e.g. the header "main site" button)
  logo: assets/bytemart_logo.png    # The main logo in the header navigation
  favicon: assets/bytemart_logo.png # The tiny icon in the browser tab
  palette:
    scheme: slate
  features:
    - content.code.copy
    - navigation.indexes         # Fold each section's index.md into the section itself,
                                 # so the heading is the (translated) page, not a second entry

plugins:
  - search                          # Must be listed explicitly once `plugins` is defined
  - i18n:
      docs_structure: suffix        # Translations live beside originals: index.fr.md, installation.de.md, ...
      fallback_to_default: true     # Untranslated pages fall back to the English (default) version
      reconfigure_material: true    # Injects the header language switcher + translates Material's UI
      reconfigure_search: false     # Keep fallback pages indexed under every language prefix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
        - locale: fr
          name: Français
          build: true
        - locale: es
          name: Español
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:         # Section headings in `nav` (page titles come from each `# H1`)
            Plugins: 插件
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Plugins: Плагины

hooks:
  - hooks/i18n_search_split.py       # Splits the search index into one file per language

# Explicit navigation. Leaf entries are listed without a title on purpose, so each
# page's label comes from its own translated `# H1` rather than being pinned to
# English. The two section headings below are literal, and are translated per locale
# via `nav_translations` above ("Tribescore" is a product name, so it never changes).
nav:
  - index.md
  - Plugins:
      - plugins/index.md
      - plugins/common-configuration.md
      - Tribescore:
          - plugins/tribescore/index.md
          - plugins/tribescore/configuration.md
          - plugins/tribescore/commands.md
          - plugins/tribescore/discord-bot.md

markdown_extensions:
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.superfences

extra_css:
  - stylesheets/bytemart.css
